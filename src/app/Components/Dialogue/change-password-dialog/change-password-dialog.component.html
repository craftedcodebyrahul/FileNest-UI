<div class="dialog-shell">

  <div class="dialog-header">
    <div class="dialog-title-row">
      <div class="dialog-icon">
        <mat-icon>vpn_key</mat-icon>
      </div>
      <h2 class="dialog-title">Change Password</h2>
    </div>
    <button mat-icon-button class="close-btn" (click)="onCancel()" aria-label="Close" [disabled]="isLoading">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content class="dialog-body">
    <p class="dialog-description">Ensure your account is secure by choosing a strong, unique password.</p>
    
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Current Password</mat-label>
      <mat-icon matPrefix>lock</mat-icon>
      <input matInput 
             [type]="showOldPassword ? 'text' : 'password'" 
             [(ngModel)]="oldPassword" 
             required 
             placeholder="Enter current password" 
             [disabled]="isLoading" />
      <button mat-icon-button matSuffix (click)="showOldPassword = !showOldPassword" type="button" tabindex="-1">
        <mat-icon>{{showOldPassword ? 'visibility' : 'visibility_off'}}</mat-icon>
      </button>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>New Password</mat-label>
      <mat-icon matPrefix>lock_open</mat-icon>
      <input matInput 
             [type]="showNewPassword ? 'text' : 'password'" 
             [(ngModel)]="newPassword" 
             required 
             placeholder="Enter new password" 
             [disabled]="isLoading" />
      <button mat-icon-button matSuffix (click)="showNewPassword = !showNewPassword" type="button" tabindex="-1">
        <mat-icon>{{showNewPassword ? 'visibility' : 'visibility_off'}}</mat-icon>
      </button>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Confirm New Password</mat-label>
      <mat-icon matPrefix>check_circle</mat-icon>
      <input matInput 
             [type]="showConfirmPassword ? 'text' : 'password'" 
             [(ngModel)]="confirmPassword" 
             required 
             placeholder="Confirm new password" 
             (keydown.enter)="onSubmit()" 
             [disabled]="isLoading" />
      <button mat-icon-button matSuffix (click)="showConfirmPassword = !showConfirmPassword" type="button" tabindex="-1">
        <mat-icon>{{showConfirmPassword ? 'visibility' : 'visibility_off'}}</mat-icon>
      </button>
    </mat-form-field>
  </mat-dialog-content>

  <div class="dialog-actions">
    <button mat-stroked-button class="cancel-btn" (click)="onCancel()" [disabled]="isLoading">Cancel</button>
    <button mat-flat-button class="confirm-btn" 
            (click)="onSubmit()" 
            [disabled]="!oldPassword || !newPassword || !confirmPassword || isLoading">
      Update Password
    </button>
  </div>

</div>
