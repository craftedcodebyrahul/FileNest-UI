<div class="dialog-shell">

  <div class="dialog-header">
    <div class="dialog-title-row">
      <div class="dialog-icon">
        <mat-icon>{{ data?.mode === 'rename' ? 'drive_file_rename_outline' : 'create_new_folder' }}</mat-icon>
      </div>
      <h2 class="dialog-title">{{ data?.mode === 'rename' ? 'Rename' : 'New Folder' }}</h2>
    </div>
    <button mat-icon-button class="close-btn" (click)="onCancel()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content class="dialog-body">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ data?.mode === 'rename' ? 'New name' : 'Folder name' }}</mat-label>
      <mat-icon matPrefix>{{ data?.mode === 'rename' ? 'edit' : 'folder' }}</mat-icon>
      <input matInput [(ngModel)]="folderName" required
             [placeholder]="data?.mode === 'rename' ? 'Enter new name' : 'e.g. Documents'"
             (keydown.enter)="onConfirm()" />
    </mat-form-field>
  </mat-dialog-content>

  <div class="dialog-actions">
    <button mat-stroked-button class="cancel-btn" (click)="onCancel()">Cancel</button>
    <button mat-flat-button class="confirm-btn" (click)="onConfirm()" [disabled]="!folderName.trim()">
      {{ data?.mode === 'rename' ? 'Rename' : 'Create' }}
    </button>
  </div>

</div>
