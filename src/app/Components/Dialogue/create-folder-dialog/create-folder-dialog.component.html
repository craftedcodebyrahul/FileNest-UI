<h2 mat-dialog-title>{{ data?.mode === 'rename' ? 'Rename' : 'Create New Folder' }}</h2>

<mat-dialog-content>
  <mat-form-field appearance="fill">
    <mat-label>{{ data?.mode === 'rename' ? 'New Name' : 'Folder Name' }}</mat-label>
    <input matInput [(ngModel)]="folderName" required />
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button
    mat-raised-button
    color="primary"
    (click)="onConfirm()"
    [disabled]="!folderName.trim()"
  >
    {{ data?.mode === 'rename' ? 'Rename' : 'Create' }}
  </button>
</mat-dialog-actions>
