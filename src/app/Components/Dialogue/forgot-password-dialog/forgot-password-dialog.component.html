<div class="dialog-shell">

  <div class="dialog-header">
    <div class="dialog-title-row">
      <div class="dialog-icon">
        <mat-icon>lock_reset</mat-icon>
      </div>
      <h2 class="dialog-title">Reset Password</h2>
    </div>
    <button mat-icon-button class="close-btn" (click)="onCancel()" aria-label="Close" [disabled]="isLoading">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content class="dialog-body">
    <p class="dialog-description">Enter your registered email address and we'll send you a link to reset your password.</p>
    
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email address</mat-label>
      <mat-icon matPrefix>email</mat-icon>
      <input matInput type="email" [(ngModel)]="email" required placeholder="you@example.com" (keydown.enter)="onSubmit()" [disabled]="isLoading" />
    </mat-form-field>
  </mat-dialog-content>

  <div class="dialog-actions">
    <button mat-stroked-button class="cancel-btn" (click)="onCancel()" [disabled]="isLoading">Cancel</button>
    <button mat-flat-button class="confirm-btn" (click)="onSubmit()" [disabled]="!email.trim() || isLoading">
      Send Link
    </button>
  </div>

</div>
