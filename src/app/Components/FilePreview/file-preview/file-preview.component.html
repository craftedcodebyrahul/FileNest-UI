<div class="preview-shell">

  <!-- Header -->
  <div class="preview-header">
    <div class="preview-title-row">
      <mat-icon class="preview-file-icon">insert_drive_file</mat-icon>
      <h2 class="preview-title" [title]="data.file.name">{{ data.file.name }}</h2>
    </div>
    <div class="preview-header-actions">
      <a mat-icon-button [href]="data.url" target="_blank" matTooltip="Download"
         *ngIf="isImage || isPdf || isOfficeDoc" aria-label="Download file">
        <mat-icon>download</mat-icon>
      </a>
      <button mat-icon-button mat-dialog-close aria-label="Close preview">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  <!-- Content -->
  <mat-dialog-content class="preview-content">

    <!-- Image -->
    <img *ngIf="isImage" [src]="data.url" [alt]="data.file.name" class="preview-image" />

    <!-- PDF -->
    <iframe *ngIf="isPdf" [src]="data.url | safeUrl" class="preview-frame" title="PDF Preview"></iframe>

    <!-- Office docs -->
    <iframe *ngIf="isOfficeDoc"
            [src]="'https://view.officeapps.live.com/op/embed.aspx?src=' + data.url | safeUrl"
            class="preview-frame" title="Document Preview"></iframe>

    <!-- Unsupported -->
    <div *ngIf="!isImage && !isPdf && !isOfficeDoc" class="unsupported">
      <div class="unsupported-icon-wrap">
        <mat-icon>insert_drive_file</mat-icon>
      </div>
      <p class="unsupported-title">Preview not available</p>
      <p class="unsupported-sub">This file type can't be previewed in the browser</p>
      <button mat-flat-button class="open-btn" (click)="openInBrowser()">
        <mat-icon>open_in_new</mat-icon>
        Open in browser
      </button>
    </div>

  </mat-dialog-content>

</div>
