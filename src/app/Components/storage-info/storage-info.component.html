<div class="storage-card">
  <div class="storage-header">
    <mat-icon class="storage-icon">storage</mat-icon>
    <span class="storage-title">Storage</span>
  </div>

  <mat-progress-bar class="storage-bar" mode="determinate" value="65" color="primary"></mat-progress-bar>

</div>
