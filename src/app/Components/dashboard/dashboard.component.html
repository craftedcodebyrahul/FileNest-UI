<div class="dashboard-container">

  <!-- Fixed header -->
  <app-header (toggleSidebar)="sidenav.toggle()"></app-header>

  <!-- Sidenav + content -->
  <mat-sidenav-container class="main-container" [hasBackdrop]="isMobile">

    <mat-sidenav #sidenav
                 [mode]="isMobile ? 'over' : 'side'"
                 [(opened)]="isSidebarOpen"
                 class="sidebar-panel">
      <app-sidebar></app-sidebar>
    </mat-sidenav>

    <mat-sidenav-content class="main-sidenav-content">
      <main class="main-content">
        <app-file-explorer class="file-explorer-container"></app-file-explorer>
      </main>
    </mat-sidenav-content>

  </mat-sidenav-container>
</div>
