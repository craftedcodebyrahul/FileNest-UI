<div class="auth-wrapper">
  <!-- Glowing ambient background blobs -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="auth-card glass-card">

    <!-- Brand Header -->
    <div class="brand-header">
      <div class="brand-badge">
        <mat-icon>person_add_alt_1</mat-icon>
      </div>
      <h1 class="brand-title">Create Account</h1>
      <p class="brand-subtitle">Join FileNest and get 15GB free cloud storage</p>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="onSignup()" class="auth-form" novalidate>

      <div class="name-grid">
        <div class="input-field">
          <label for="first_name">First Name</label>
          <div class="input-box">
            <input id="first_name" type="text" formControlName="first_name" placeholder="John" autocomplete="given-name" />
          </div>
          <div class="field-error" *ngIf="form.get('first_name')?.touched && form.get('first_name')?.hasError('required')">Required</div>
        </div>

        <div class="input-field">
          <label for="last_name">Last Name</label>
          <div class="input-box">
            <input id="last_name" type="text" formControlName="last_name" placeholder="Doe" autocomplete="family-name" />
          </div>
          <div class="field-error" *ngIf="form.get('last_name')?.touched && form.get('last_name')?.hasError('required')">Required</div>
        </div>
      </div>

      <div class="input-field">
        <label for="email">Email Address</label>
        <div class="input-box">
          <mat-icon class="field-icon">mail_outline</mat-icon>
          <input id="email" type="email" formControlName="email" placeholder="name@company.com" autocomplete="email" />
        </div>
        <div class="field-error" *ngIf="form.get('email')?.touched && form.get('email')?.hasError('required')">Email is required</div>
        <div class="field-error" *ngIf="form.get('email')?.touched && form.get('email')?.hasError('email')">Valid email required</div>
      </div>

      <div class="input-field">
        <label for="phone_number">Phone Number</label>
        <div class="input-box">
          <mat-icon class="field-icon">phone_iphone</mat-icon>
          <input id="phone_number" type="tel" formControlName="phone_number" placeholder="+1 (555) 000-0000" autocomplete="tel" />
        </div>
        <div class="field-error" *ngIf="form.get('phone_number')?.touched && form.get('phone_number')?.hasError('required')">Phone is required</div>
      </div>

      <div class="input-field">
        <label for="password">Password</label>
        <div class="input-box">
          <mat-icon class="field-icon">lock_open</mat-icon>
          <input id="password" [type]="hidePassword ? 'password' : 'text'" formControlName="password"
            placeholder="Min. 8 characters" autocomplete="new-password" />
          <button type="button" class="icon-btn" (click)="hidePassword = !hidePassword" tabindex="-1">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
        <div class="field-error" *ngIf="form.get('password')?.touched && form.get('password')?.hasError('required')">Password is required</div>
        <div class="field-error" *ngIf="form.get('password')?.touched && form.get('password')?.hasError('minlength')">Minimum 8 characters</div>
      </div>

      <button mat-flat-button class="submit-btn" type="submit" [disabled]="form.invalid || isLoading">
        <mat-spinner *ngIf="isLoading" diameter="20" class="btn-spinner"></mat-spinner>
        <ng-container *ngIf="!isLoading">
          <span>Create Account</span>
          <mat-icon>arrow_forward</mat-icon>
        </ng-container>
      </button>

    </form>

    <div class="auth-footer">
      <span>Already have an account?</span>
      <a routerLink="/login" class="login-link">Sign In</a>
    </div>

  </div>
</div>
