<mat-toolbar class="app-header">

  <!-- Left Section: Menu Toggle & Brand -->
  <div class="header-left">
    <button mat-icon-button class="menu-btn" (click)="toggleSidebar.emit()" aria-label="Toggle Navigation">
      <mat-icon>menu</mat-icon>
    </button>

    <div class="brand">
      <div class="brand-badge">
        <mat-icon>cloud_sync</mat-icon>
      </div>
      <span class="brand-name">FileNest</span>
    </div>
  </div>

  <!-- Center Section: Search Bar -->
  <div class="header-center">
    <div class="search-box">
      <mat-icon class="search-icon">search</mat-icon>
      <input class="search-input" type="text" placeholder="Search files, folders & documents..." aria-label="Search files" (input)="onSearch($event)" />
    </div>
  </div>

  <!-- Right Section: Actions & User Dropdown -->
  <div class="header-right">
    <button mat-icon-button class="icon-btn" aria-label="Notifications" matTooltip="Notifications">
      <mat-icon>notifications_none</mat-icon>
    </button>

    <!-- User Profile Trigger Button -->
    <div class="user-trigger-btn" [matMenuTriggerFor]="userMenu" role="button" tabindex="0" aria-label="User Account Menu">
      <div class="avatar-ring">
        <img *ngIf="userAvatarUrl" [src]="userAvatarUrl" alt="User Profile" class="avatar-img" />
        <div *ngIf="!userAvatarUrl" class="avatar-text">{{ userInitials }}</div>
      </div>
      <span class="user-name-label">{{ userDisplayName }}</span>
      <mat-icon class="dropdown-icon">expand_more</mat-icon>
    </div>


    <!-- User Profile Dropdown Menu -->
    <mat-menu #userMenu="matMenu" panelClass="user-profile-menu" [hasBackdrop]="true" xPosition="before">
      <div class="menu-header-card" (click)="$event.stopPropagation()">
        <div class="header-avatar-lg">
          <img *ngIf="userAvatarUrl" [src]="userAvatarUrl" alt="Avatar" class="avatar-img-lg" />
          <div *ngIf="!userAvatarUrl" class="avatar-initials-lg">{{ userInitials }}</div>
        </div>
        <div class="header-details">
          <span class="header-user-name">{{ userDisplayName }}</span>
          <span class="header-user-email">{{ user?.email || 'authenticated' }}</span>
        </div>
      </div>

      <mat-divider></mat-divider>

      <button mat-menu-item (click)="openChangePasswordDialog()">
        <mat-icon class="menu-icon">lock_reset</mat-icon>
        <span>Change Password</span>
      </button>

      <mat-divider></mat-divider>

      <button mat-menu-item class="logout-item" (click)="logout()">
        <mat-icon class="menu-icon danger-icon">logout</mat-icon>
        <span>Sign Out</span>
      </button>
    </mat-menu>
  </div>

</mat-toolbar>
