<mat-toolbar class="app-header">

  <!-- Sidebar toggle -->
  <button mat-icon-button class="menu-btn" (click)="toggleSidebar.emit()" aria-label="Toggle sidebar">
    <mat-icon>menu</mat-icon>
  </button>

  <!-- Brand -->
  <div class="brand">
    <div class="brand-icon">
      <mat-icon>folder_special</mat-icon>
    </div>
    <span class="brand-name">FileNest</span>
  </div>

  <!-- Spacer -->
  <span class="spacer"></span>

  <!-- Search bar (hidden on small screens) -->
  <div class="search-bar">
    <mat-icon class="search-icon">search</mat-icon>
    <input class="search-input" type="text" placeholder="Search files…" aria-label="Search files" />
  </div>

  <span class="spacer"></span>

  <!-- Notifications -->
  <button mat-icon-button class="icon-btn" aria-label="Notifications" matTooltip="Notifications">
    <mat-icon>notifications_none</mat-icon>
  </button>

  <!-- Avatar / User menu -->
  <button mat-icon-button class="avatar-btn" [matMenuTriggerFor]="userMenu" aria-label="User account menu">
    <div class="avatar">{{ userInitials }}</div>
  </button>

  <!-- User profile menu -->
  <mat-menu #userMenu="matMenu" panelClass="user-profile-panel" [hasBackdrop]="true">
    <div class="menu-user-header" (click)="$event.stopPropagation()">
      <div class="menu-avatar">{{ userInitials }}</div>
      <div class="menu-user-info">
        <span class="menu-user-name">{{ user?.first_name }} {{ user?.last_name }}</span>
        <span class="menu-user-email">{{ user?.email }}</span>
      </div>
    </div>

    <mat-divider></mat-divider>

    <button mat-menu-item class="menu-item-detail" (click)="$event.stopPropagation()">
      <mat-icon>phone</mat-icon>
      <span>{{ user?.phone_number || 'No phone' }}</span>
    </button>

    <mat-divider></mat-divider>

    <button mat-menu-item class="menu-item-logout" (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Sign out</span>
    </button>
  </mat-menu>

</mat-toolbar>
